<!doctype html>
<html lang="en">
<head>
<script src="offline.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Monstermon Dex · dreamPlay</title>
<link rel="icon" href="icon.png">
<style>
  html, body { margin: 0; background: #04060c; color: #e8f1ff; font-family: "Segoe UI", system-ui, sans-serif; }
  h1 { margin: 16px 20px 4px; color: #47b4ff; } .sub { margin: 0 20px 10px; color: #7f94bd; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 20px 12px; align-items: center; }
  .bar button { background: #0e1830; border: 1px solid #16264a; color: #fff; padding: 7px 12px; border-radius: 10px; font-weight: 800; cursor: pointer; } .bar button.on { background: #2493ff; }
  .bar input { background: #050a16; border: 1px solid #16264a; color: #fff; padding: 8px 12px; border-radius: 10px; font-size: 14px; min-width: 200px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; padding: 0 20px 24px; }
  .card { background: #0a1222; border: 1px solid #16264a; border-radius: 16px; overflow: hidden; } .card.t5 { border-color: #ffd34d; box-shadow: 0 0 14px rgba(255,211,77,.3); }
  .card img { width: 100%; height: 170px; display: block; background: radial-gradient(ellipse at 50% 40%, #1d3a6a, #0a1222 75%); object-fit: contain; }
  .card div { padding: 8px 12px 12px; } .card b { font-size: 16px; } .card i { color: #ffd34d; font-style: normal; font-size: 12px; margin-left: 4px; }
  .card p { margin: 6px 0 0; color: #a9bad8; font-size: 12px; line-height: 1.35; } .tag { display: inline-block; background: #0e1830; border-radius: 8px; padding: 2px 6px; font-size: 11px; margin: 4px 4px 0 0; color: #cfe; }
  a.btn { position: fixed; top: 14px; right: 18px; background: #0e1830; border: 1px solid #16264a; color: #fff; padding: 8px 14px; border-radius: 12px; text-decoration: none; font-weight: 800; }
</style>
<style>html, body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }</style>
</head>
<body>
<a class="btn" href="/adventure.html">🧭 To the adventure</a>
<h1>Monstermon Dex</h1>
<div class="sub" id="count"></div>
<div class="bar" id="filters"></div>
<div id="grid"></div>
<script type="module">
import * as THREE from './lib/three.module.min.js';
import { SPECIES, buildMon, ABILITIES } from './adv_mons.js';
const ICON = { fire: '🔥', water: '💧', plant: '🌿', metal: '⚙️', wind: '🌪️', stone: '🪨', light: '✨' };
const HAND = { dracometal: 'metal', dracotime: 'metal', metasteal: 'wind', metawing: 'wind', pinkypunch: 'light', pinkyabsorve: 'light', skipclip: 'plant', rootlock: 'stone', rivolo: 'water', mossroll: 'plant', glimframe: 'light', bellbud: 'plant', emberlid: 'fire', hingemaw: 'metal', paperfang: 'wind', inkling: 'water', staplor: 'metal', lanternix: 'fire', aurorell: 'light', foldragon: 'wind' };
const elemOf = (sp) => HAND[sp] || SPECIES[sp].elem;
const ids = Object.keys(SPECIES);
const enemies = ids.filter((id) => !SPECIES[id].starter && !SPECIES[id].evoOf && id !== 'foldragon').length;
document.getElementById('count').textContent = `${ids.length} creatures in total · ${enemies} wild Monstermon you can find and catch (plus the starters, their evolutions and the boss).`;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.setSize(300, 230);
const cache = new Map();
function shot(sp) {
  if (cache.has(sp)) return cache.get(sp);
  const scene = new THREE.Scene(); scene.add(new THREE.HemisphereLight(0xdff2ff, 0x334455, 1.3)); const l = new THREE.DirectionalLight(0xffffff, 2.2); l.position.set(3, 5, 4); scene.add(l);
  const mon = buildMon(sp, 'angry'); scene.add(mon); mon.userData.anim && mon.userData.anim(0.7, {}); mon.rotation.y = 0.55;
  const box = new THREE.Box3().setFromObject(mon), size = box.getSize(new THREE.Vector3()), c = box.getCenter(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(35, 300 / 230, 0.1, 80); cam.position.set(c.x, c.y + size.y * 0.15, c.z + Math.max(size.y, size.x) * 2.1 + 1); cam.lookAt(c);
  renderer.render(scene, cam); const url = renderer.domElement.toDataURL('image/png'); cache.set(sp, url); return url;
}
let filter = 'all', query = '';
const fb = document.getElementById('filters');
fb.innerHTML = ['all', ...Object.keys(ICON)].map((k) => `<button data-f="${k}" class="${k === 'all' ? 'on' : ''}">${k === 'all' ? 'All' : ICON[k] + ' ' + k[0].toUpperCase() + k.slice(1)}</button>`).join('') + '<input id="q" placeholder="🔎 Search a name…">';
fb.querySelectorAll('[data-f]').forEach((b) => b.onclick = () => { filter = b.dataset.f; fb.querySelectorAll('[data-f]').forEach((x) => x.classList.toggle('on', x === b)); draw(); });
document.getElementById('q').oninput = (e) => { query = e.target.value.toLowerCase(); draw(); };
let job = 0;
function draw() {
  const my = ++job, grid = document.getElementById('grid'); grid.innerHTML = '';
  const list = ids.filter((id) => (filter === 'all' || elemOf(id) === filter) && SPECIES[id].name.toLowerCase().includes(query));
  const cards = list.map((sp) => {
    const d = SPECIES[sp], el = elemOf(sp), card = document.createElement('div'); card.className = 'card' + (d.tier === 5 || d.legendary ? ' t5' : '');
    const abil = (d.abilities || []).map((a) => `<span class="tag">${ABILITIES[a][0]} ${ABILITIES[a][1]}</span>`).join('');
    card.innerHTML = `<img alt=""><div><b>${ICON[el] || ''} ${d.name}</b>${d.legendary ? '<i>LEGENDARY</i>' : d.tier ? `<i>${'★'.repeat(d.tier)}</i>` : d.evoOf ? `<i>evolves from ${SPECIES[d.evoOf].name}</i>` : d.starter ? '<i>starter</i>' : ''}${abil}<p>${d.about}</p></div>`;
    grid.appendChild(card); return [sp, card.querySelector('img')];
  });
  let i = 0;
  const step = () => { if (my !== job) return; for (let k = 0; k < 6 && i < cards.length; k++, i++) cards[i][1].src = shot(cards[i][0]); if (i < cards.length) requestAnimationFrame(step); };
  step();
}
draw();
</script>
</body>
</html>
